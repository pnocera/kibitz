name: tests
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # kibitzer is Bun TypeScript, so without this every test that runs the
      # binary fails on `env: 'bun': No such file or directory` -- 82 of them.
      # Codex itself is faked inside the suite and is not needed here.
      # Pinned, not `latest`: this job is the only automated gate, so a red run
      # should mean a repository change, not a Bun release published overnight.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Show versions
        run: bun --version && jq --version
      - name: Run acceptance tests
        run: bash tests/run-tests.sh
